name: Rebuild and deploy

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build and deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref main